name: Backend quality

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
      - uses: actions/cache@v4
        with:
          path: apps/backend/vendor
          key: ${{ runner.os }}-php-8.4-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.4-
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        env:
          APP_ENV: test
        run: vendor/bin/phpunit --testdox
