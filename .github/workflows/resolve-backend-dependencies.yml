name: Resolve backend Composer dependencies

on:
  push:
    branches:
      - automation/backend-dto-httpclient
    paths:
      - "apps/backend/composer.json"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
      - name: Resolve and lock dependencies
        run: composer update symfony/http-client phpstan/phpstan friendsofphp/php-cs-fixer --with-all-dependencies --no-interaction --prefer-dist
      - name: Validate Composer lock
        run: composer validate --no-check-publish
      - name: Commit generated lock file
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/composer.lock
          git commit -m "build(backend): lock HTTP client and quality tools"
          git push
