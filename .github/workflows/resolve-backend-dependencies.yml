name: Resolve backend Composer dependencies

on:
  push:
    branches:
      - automation/backend-dto-httpclient
    paths:
      - "apps/backend/composer.json"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
      - name: Download Composer manifests from the branch
        run: |
          mkdir -p apps/backend
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/rami-aouinti/bro-world-ai/automation/backend-dto-httpclient/apps/backend/composer.json" \
            --output apps/backend/composer.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/rami-aouinti/bro-world-ai/automation/backend-dto-httpclient/apps/backend/composer.lock" \
            --output apps/backend/composer.lock
      - name: Resolve and lock dependencies
        working-directory: apps/backend
        run: composer update symfony/http-client phpstan/phpstan friendsofphp/php-cs-fixer --with-all-dependencies --no-interaction --prefer-dist
      - name: Validate Composer lock
        working-directory: apps/backend
        run: composer validate --no-check-publish
      - name: Commit generated lock file through the GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'automation/backend-dto-httpclient';
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
            const { data: parent } = await github.rest.git.getCommit({ owner, repo, ref: ref.object.sha });
            const { data: blob } = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync('apps/backend/composer.lock', 'utf8'),
              encoding: 'utf-8'
            });
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.tree.sha,
              tree: [{ path: 'apps/backend/composer.lock', mode: '100644', type: 'blob', sha: blob.sha }]
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'build(backend): lock HTTP client and quality tools',
              tree: tree.sha,
              parents: [ref.object.sha]
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/' + branch,
              sha: commit.sha,
              force: false
            });
            core.info('Updated composer.lock in ' + branch + ': ' + commit.sha);
